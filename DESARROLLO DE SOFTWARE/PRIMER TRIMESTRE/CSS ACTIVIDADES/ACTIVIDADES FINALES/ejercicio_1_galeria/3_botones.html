<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>libreria de botones</title>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body>
    <h1>Librería de botones CSS</h1>

    <p>
        Ejemplo de diferentes variantes de botones utilizando CSS.
    </p>
<section>
    <h2>Botones Principales</h2>
            
    <div class="catalogo">

                <div class="boton-item">
        <button class="btn btn-primary">Primario</button>
        <p>.btn-primario</p>
                </div>

    <div class="boton-item">
        <button class="btn btn-outline">Outline</button>
        <p>.btn-outline</p>
    </div>

    <div class="boton-item">
        <button class="btn btn-danger">Peligro</button>
        <p>.btn-peligro</p>
    </div>

    <div class="boton-item">
        <button class="btn btn-ghost">Ghost</button>
        <p>.btn-Ghost</p>
    </div>

    <div class="boton-item">
        <button class="btn btn-success">Éxito</button>
        <p>.btn-Exito</p>
    </div>

    <div class="boton-item">
        <button class="btn btn-warning">Advertencia</button>
        <p>.btn-Advertencia</p>
    </div>
</div>

</section>


<section>

<h2>Tamaños</h2>

    <div class="catalogo tamaños" >


        <div class="boton-item">
    <button class="btn btn-sm">Pequeño</button>
        <p> .btn-sm </p>
    </div>

<div class="boton-item">
    <button class="btn"> Normal</button>
        <p>.btn</p>
</div>

<div class="boton-item">
    <button class="btn btn-lg">Grande</button>
        <p> .btn-lg </p>
</div>
    </div>
</section>


<section>
<h2>Estados</h2>
<div class="catalogo Estados">
<div class="boton-item"> 
<button class="btn" disabled> Deshabilitado</button> 

<p>.btn:disabled</p>

<button class="btn btn-loading">
<span class="spinner"></span>
    Cargando...
</button>
<p>.btn-loading</p>


</section>  

</body>
</html>
